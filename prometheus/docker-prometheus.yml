global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
alerting:
  alertmanagers:
  - static_configs:
    - targets:
rule_files:
scrape_configs:
  - job_name: 'ethereum_crawler'
    static_configs:
      - targets: ['eth_crawler:9080']
        labels:
          network: 'ethereum'
  
  - job_name: 'polygon_crawler'
    static_configs:
      - targets: ['polygon_crawler:9080']
        labels:
          network: 'polygon'
  
  - job_name: 'filecoin_crawler'
    static_configs:
      - targets: ['filecoin_crawler:9080']
        labels:
          network: 'filecoin'